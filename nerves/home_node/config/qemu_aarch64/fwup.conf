# The qemu_aarch64 system's fwup.conf with bigger rootfs partitions. Its 50 MB rootfs
# can't hold home_base with Membrane's precompiled ffmpeg and emerge's NIF (about 85 MB of
# squashfs). fwup's define() keeps a value that is already defined, so this one wins.
define(ROOTFS_A_PART_COUNT, 393216) # 192 MB

include("${NERVES_SDK_IMAGES:-.}/fwup.conf")
